    <div class="summary-panel">
        <div class="stats-grid">
            <!-- Cantidad -->
            <div class="stat-card full-width">
                <div class="stat-label">Cantidad (unidades)</div>
                <div class="quantity-control">
                    <input type="number" id="inputPanes" class="qty-input" value="1" min="1" step="1">
                    <span class="unit-text">unidades</span>
                </div>
                <div style="font-size: 0.65rem; color: #8B7355; margin-top: 5px;">
                    📏 Formato de 38 cm de largo
                </div>
            </div>

            <!-- Costo -->
            <div class="stat-card">
                <div class="stat-label">Costo insumos</div>
                <div class="stat-value cost" id="resCosto">$ 0.00</div>
            </div>

            <!-- Peso Total -->
            <div class="stat-card">
                <div class="stat-label">Peso Total Pan</div>
                <div class="stat-value" id="resTotal">0 g</div>
            </div>

            <!-- Peso Masa -->
            <div class="stat-card">
                <div class="stat-label">Peso Masa</div>
                <div class="stat-value" id="resMasa" style="color: var(--color-rustic);">0 g</div>
            </div>

            <!-- Peso Relleno -->
            <div class="stat-card">
                <div class="stat-label">Peso Relleno</div>
                <div class="stat-value" id="resRelleno" style="color: #C0392B;">0 g</div>
            </div>
        </div>
    </div>
