<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Pan Campesino | Gestión de Producción</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/estilo-comun.css">
    
    <!-- Estilos específicos para el estado del botón -->
    <style>
        .wakelock-status {
            position: fixed;
            bottom: 15px;
            left: 15px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.6rem;
            z-index: 1000;
            font-family: monospace;
            display: none;
        }
        .wakelock-status.show {
            display: block;
        }
        .wakelock-status.active {
            background: #4caf50;
        }
        .wakelock-status.error {
            background: #e53e3e;
        }
        .btn-wakelock-active {
            background: #4caf50 !important;
        }
    </style>
    
    <script>
        window.datosProducto = {
            nombre: "Pan Campesino",
            harinaPorUnidad: 230.0,
            items: [
                { nombre: "Harina", pct: 100.0, precioKg: 0 },
                { nombre: "Agua", pct: 54.5, precioKg: 0 },
                { nombre: "Levadura", pct: 1.7, precioKg: 0 },
                { nombre: "Sal", pct: 2.0, precioKg: 0 },
                { nombre: "Azúcar", pct: 8.0, precioKg: 0 },
                { nombre: "Margarina", pct: 8.0, precioKg: 0 },
                { nombre: "Vainilla", pct: 0.8, precioKg: 0 }
            ]
        };
    </script>
</head>
<body>

<div class="product-card">
    <div class="product-header">
        <a href="/" class="back-button">
            <i class="fas fa-arrow-left"></i>
        </a>
        <h1>PAN CAMPESINO</h1>
        <p>Fernando Araujo</p>
        
        <!-- Botón discreto para mantener pantalla activa -->
        <button id="wakelockBtn" onclick="toggleWakeLock()" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.2); backdrop-filter: blur(6px); width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(252, 249, 245, 0.3); cursor: pointer; transition: all 0.2s ease;">
            <i class="fas fa-mobile-alt" style="color: white; font-size: 0.85rem;"></i>
        </button>
    </div>

    <div class="summary-panel">
        <div class="stats-grid">
            <div class="stat-card full-width">
                <div class="stat-label">Cantidad</div>
                <div class="quantity-control">
                    <input type="number" id="inputPanes" class="qty-input" value="1" min="1" step="1">
                    <span class="unit-text">unidades</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Costo insumos</div>
                <div class="stat-value cost" id="resCosto">$ 0.00</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Masa total</div>
                <div class="stat-value" id="resMasa">0 g</div>
            </div>
        </div>
    </div>

    <div class="ingredients-list">
        <div class="section-title">
            <i class="fas fa-flour"></i> Ingredientes
        </div>
        <div id="listaIngredientes"></div>
    </div>

    <div class="action-button">
        <button class="btn-copy" onclick="copiarAlPortapapeles()">
            <i class="fas fa-copy"></i> Copiar lista
        </button>
        <div id="copyMessage" class="copy-message">
            <i class="fas fa-check-circle"></i> ¡Lista copiada!
        </div>
    </div>

    <div class="footer-brand">
        <span>Gestión profesional de panadería</span>
    </div>
</div>

<!-- Mensaje de estado flotante -->
<div id="wakelockStatus" class="wakelock-status"></div>

<script src="/assets/js/funciones-comunes.js"></script>

<!-- Script para Wake Lock -->
<script>
    let wakeLock = null;
    let wakeLockActivo = false;

    async function toggleWakeLock() {
        const btn = document.getElementById('wakelockBtn');
        const statusDiv = document.getElementById('wakelockStatus');
        
        if (wakeLockActivo) {
            // Desactivar Wake Lock
            if (wakeLock) {
                await wakeLock.release();
                wakeLock = null;
            }
            wakeLockActivo = false;
            btn.style.background = "rgba(255,255,255,0.2)";
            btn.classList.remove('btn-wakelock-active');
            statusDiv.textContent = '⚡ Pantalla normal';
            statusDiv.className = 'wakelock-status show';
            setTimeout(() => {
                statusDiv.className = 'wakelock-status';
            }, 2000);
        } else {
            // Activar Wake Lock
            try {
                wakeLock = await navigator.wakeLock.request('screen');
                wakeLockActivo = true;
                btn.style.background = "#4caf50";
                btn.classList.add('btn-wakelock-active');
                statusDiv.textContent = '🔋 Pantalla activa (no se apagará)';
                statusDiv.className = 'wakelock-status show active';
                setTimeout(() => {
                    statusDiv.className = 'wakelock-status';
                }, 3000);
                
                // Volver a solicitar Wake Lock si la pantalla se reactiva
                document.addEventListener('visibilitychange', async () => {
                    if (wakeLockActivo && document.visibilityState === 'visible') {
                        try {
                            wakeLock = await navigator.wakeLock.request('screen');
                        } catch(e) {}
                    }
                });
            } catch (err) {
                statusDiv.textContent = '❌ Error: ' + err.message;
                statusDiv.className = 'wakelock-status show error';
                setTimeout(() => {
                    statusDiv.className = 'wakelock-status';
                }, 3000);
            }
        }
    }
</script>

</body>
</html>
