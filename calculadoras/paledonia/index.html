<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Paledonia | Gestión de Producción</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/estilo-comun.css">
    <style>
        .shape-tabs { display: flex; gap: 12px; padding: 12px 16px 0; background: var(--bg-cream); }
        .tab-btn { flex: 1; padding: 8px 12px; border: 1.5px solid var(--border-stone); background: var(--bg-card); border-radius: 40px; font-size: 0.7rem; font-weight: 600; cursor: pointer; text-transform: uppercase; color: var(--text-muted); transition: all 0.2s ease; }
        .tab-btn.active { background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark)); color: white; border-color: var(--color-primary); }
        .dimensions-panel { padding: 12px 16px; background: var(--bg-cream); border-bottom: 1px solid var(--border-stone); }
        .inputs-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .inputs-container.two-cols { grid-template-columns: repeat(2, 1fr); }
        .input-group { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .input-group label { font-size: 0.6rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .val-input { width: 100%; padding: 8px; border: 1.5px solid var(--border-stone); border-radius: 16px; text-align: center; font-weight: 600; background: var(--bg-card); color: var(--text-dark); font-size: 0.85rem; outline: none; }
        .val-input:focus { border-color: var(--color-primary); }
        @media (max-width: 480px) { .inputs-container { gap: 6px; } .val-input { padding: 6px; font-size: 0.75rem; } }
    </style>
    <script>
        const FACTOR_HARINA = 0.2028;
        window.datosProducto = {
            nombre: "Paledonia",
            factorHarina: FACTOR_HARINA,
            esVolumen: true,
            items: [
                { nombre: "Harina", pct: 100.0, precioKg: 0 },
                { nombre: "Agua", pct: 100.0, precioKg: 0 },
                { nombre: "Panela", pct: 81.0, precioKg: 0 },
                { nombre: "Margarina", pct: 10.0, precioKg: 0 },
                { nombre: "Huevos", pct: 9.4, precioKg: 0 },
                { nombre: "Sal", pct: 1.0, precioKg: 0 },
                { nombre: "Polvo de hornear", pct: 2.0, precioKg: 0 },
                { nombre: "Canela", pct: 2.0, precioKg: 0 }
            ]
        };
    </script>
</head>
<body>
<div class="product-card">
    <div class="product-header">
        <a href="/" class="back-button"><i class="fas fa-arrow-left"></i></a>
        <h1>PALEDONIA</h1>
        <p>Fernando Araujo</p>
    </div>

    <div class="shape-tabs">
        <button class="tab-btn active" onclick="switchTab('rect')">Rectangular</button>
        <button class="tab-btn" onclick="switchTab('cyl')">Cilíndrica</button>
    </div>

    <div id="inputs-rect" class="dimensions-panel">
        <div class="inputs-container">
            <div class="input-group"><label>Largo (cm)</label><input type="number" id="largo" class="val-input" value="22" step="0.5" oninput="calcularVolumen()"></div>
            <div class="input-group"><label>Profundidad (cm)</label><input type="number" id="profundidad" class="val-input" value="29.5" step="0.5" oninput="calcularVolumen()"></div>
            <div class="input-group"><label>Altura (cm)</label><input type="number" id="alto-rect" class="val-input" value="5" step="0.1" oninput="calcularVolumen()"></div>
        </div>
    </div>

    <div id="inputs-cyl" class="dimensions-panel" style="display: none;">
        <div class="inputs-container two-cols">
            <div class="input-group"><label>Diámetro (cm)</label><input type="number" id="diametro" class="val-input" value="26" step="0.5" oninput="calcularVolumen()"></div>
            <div class="input-group"><label>Altura (cm)</label><input type="number" id="alto-cyl" class="val-input" value="8" step="0.1" oninput="calcularVolumen()"></div>
        </div>
    </div>

    <div class="summary-panel">
        <div class="stats-grid">
            <div class="stat-card full-width">
                <div class="stat-label">Cantidad</div>
                <div class="quantity-control">
                    <input type="number" id="inputPanes" class="qty-input" value="1" min="1" step="1" oninput="calcularVolumen()">
                    <span class="unit-text">unidades</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Costo producción</div>
                <div class="stat-value cost" id="resCosto">$ 0.00</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Masa total</div>
                <div class="stat-value" id="resMasa">0 g</div>
            </div>
        </div>
    </div>

    <div class="ingredients-list">
        <div class="section-title"><i class="fas fa-cake-candles"></i> Ingredientes</div>
        <div id="listaIngredientes"></div>
    </div>

    <div class="action-button">
        <button class="btn-copy" onclick="copiarAlPortapapeles()"><i class="fas fa-copy"></i> Copiar lista</button>
        <div id="copyMessage" class="copy-message"><i class="fas fa-check-circle"></i> ¡Lista copiada!</div>
    </div>
    <div class="footer-brand"><span>Gestión profesional de panadería</span></div>
</div>

<script>
    let currentShape = 'rect';
    function switchTab(shape) {
        currentShape = shape;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        if (shape === 'rect') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('inputs-rect').style.display = 'block';
            document.getElementById('inputs-cyl').style.display = 'none';
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('inputs-rect').style.display = 'none';
            document.getElementById('inputs-cyl').style.display = 'block';
        }
        calcularVolumen();
    }

    function getVolumen() {
        if (currentShape === 'rect') {
            const l = parseFloat(document.getElementById('largo').value) || 0;
            const p = parseFloat(document.getElementById('profundidad').value)
